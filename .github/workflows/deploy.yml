# On a version tag (vX.Y.Z): build the Docker image here (CapRover only pulls and runs it),
# push it to GHCR, keep the versioned source TAR as an artifact, and deploy the image.
#
# Requires:
#   - secret CAPROVER_APP_TOKEN (CapRover → Apps → catalogo-perro-cafe → Deployment → "Enable App Token")
#   - CapRover able to pull from ghcr.io (public package, or a ghcr.io remote registry in CapRover)
# Optional:
#   - variable NEXT_PUBLIC_SITE_URL (defaults to https://catalogo.perro.cafe; inlined at build time)
name: Deploy

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-caprover
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP_NAME: catalogo-perro-cafe
  CAPROVER_URL: https://captain.pozole.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build versioned source TAR
        run: |
          TAR="$APP_NAME-$VERSION.tar"
          git archive --format=tar -o "$TAR" HEAD
          echo "TAR=$TAR" >> "$GITHUB_ENV"

      - name: Keep TAR as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: ${{ env.TAR }}
          retention-days: 30

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://catalogo.perro.cafe' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to CapRover
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          npx --yes caprover@2 deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appName "$APP_NAME" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --imageName "$IMAGE:$VERSION"
